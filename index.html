    <meta charset="UTF-8" />

    <!-- Fonts are self-hosted (see @font-face in src/index.css). We used to
         pull Barlow / Barlow Condensed from fonts.googleapis.com, but that
         <link rel="stylesheet"> is render-blocking: on a device that can't
         reach Google (offline, or F-Droid users who firewall Google), the
         WebView's first paint stalled on the request and the app hung on the
         native gradient splash with no content. Self-hosting also removes the
         third-party Google call, which F-Droid requires. -->
  </head>
