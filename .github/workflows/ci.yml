name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Scans every tracked file, not just staged ones — nothing is staged in
      # CI, so the default (hook) mode would pass vacuously.
      - name: Secret scan
        run: node scripts/check-secrets.mjs --all

      # The working agreement calls this gate mandatory. Two releases shipped
      # broken because it was skipped by hand; this makes it structural.
      # `npm run build` runs tsc before vite, so this is the typecheck too.
      # v1.12 Item 1. StudyDesk shipped `android.captureInput: true` for months,
      # which made CJK text entry impossible, because nobody has ever typed
      # Chinese into any of these apps. A one-line fix does not stop that
      # recurring; failing the build does.
      - name: IME guard
        run: node scripts/check-ime.mjs

      - name: Build gate
        run: npm run build

      # Already at --max-warnings 0 locally; this makes that standard hold in
      # CI rather than depending on whoever remembers to run it.
      - name: Lint
        run: npm run lint

      # v1.16 (limecore#11). Characterization tests over the training maths:
      # the shared 1RM estimator, PR detection and the last-session lookup the
      # progression nudge reads. They exist so the code-health pass
      # (limecore#12) has something to refactor against.
      - name: Test gate
        run: npm test
